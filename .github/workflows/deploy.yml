name: Deploy to VPS

# Every push to main deploys to the VPS automatically.
#  - SSH job (instant): runs when VPS_HOST plus VPS_SSH_KEY or VPS_PASSWORD secrets are set.
#    Recreates the app and Caddy services; the app pulls the latest code and installs dependencies.
#    Optional secrets: VPS_USER_WA (SSH user, default root), VPS_PORT (default 22).
#  - Hostinger job: redeploys the Compose stack when HOSTINGER_API_KEY + HOSTINGER_VM_ID are set.
#  - With no deploy credentials, src/autoupdate.js updates app code only; it cannot add/recreate Caddy.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find src public scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install dependencies for full integration tests
        run: npm ci --no-audit --no-fund
      - name: Validate optional mail Docker Compose
        run: docker compose -f deploy/mail/docker-compose.yml config --quiet
      - name: Run regression and integration tests
        run: node --test tests/*.test.js
  ssh-deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      HAS_SSH: ${{ secrets.VPS_HOST != '' && (secrets.VPS_SSH_KEY != '' || secrets.VPS_PASSWORD != '') }}
    steps:
      - name: Skip notice
        if: env.HAS_SSH != 'true'
        run: echo "SSH deploy skipped - add VPS_HOST and VPS_SSH_KEY (or VPS_PASSWORD) secrets to enable it."

      - name: Redeploy app and Caddy on VPS
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER_WA || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DOCKER=docker
            if ! docker ps >/dev/null 2>&1; then DOCKER="sudo docker"; fi
            ID=$($DOCKER ps -q --filter label=com.docker.compose.project=air-agent --filter label=com.docker.compose.service=app | head -n1)
            if [ -z "$ID" ]; then
              echo "Could not find the air-agent app container. Running containers:"
              $DOCKER ps --format '{{.Names}}'
              exit 1
            fi
            WORKDIR=$($DOCKER inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$ID")
            COMPOSE_FILES=$($DOCKER inspect --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$ID")
            COMPOSE_FILE=$(printf '%s' "$COMPOSE_FILES" | cut -d, -f1)
            if [ -z "$WORKDIR" ] || [ -z "$COMPOSE_FILE" ] || [ ! -f "$COMPOSE_FILE" ]; then
              echo "Could not locate the existing air-agent Compose file from Docker labels."
              echo "Set VPS_HOST and SSH access to a Docker Compose project created from this repository."
              exit 1
            fi
            echo "Recreating app and Caddy from $COMPOSE_FILE for commit ${{ github.sha }}"
            $DOCKER compose --project-directory "$WORKDIR" -f "$COMPOSE_FILE" up -d --force-recreate app
            ID=$($DOCKER ps -q --filter label=com.docker.compose.project=air-agent --filter label=com.docker.compose.service=app | head -n1)
            i=0
            while [ "$i" -lt 60 ]; do
              ACTUAL=$($DOCKER exec "$ID" git -C /srv/app rev-parse HEAD 2>/dev/null || true)
              if [ "$ACTUAL" = "${{ github.sha }}" ]; then break; fi
              sleep 5
              i=$((i + 1))
            done
            if [ "$ACTUAL" != "${{ github.sha }}" ]; then
              echo "App did not pull the requested commit; leaving Caddy unchanged."
              $DOCKER logs --tail 50 "$ID"
              exit 1
            fi
            $DOCKER compose --project-directory "$WORKDIR" -f "$COMPOSE_FILE" up -d --force-recreate caddy
            $DOCKER logs --tail 30 "$ID"

  hostinger-deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.HOSTINGER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Hostinger VPS
        if: env.HAS_KEY == 'true'
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: air-agent
          docker-compose-path: docker-compose.yml
          environment-variables: |
            DEPLOY_SHA=${{ github.sha }}
