name: Deploy to VPS

# Every push to main deploys to the VPS automatically.
#  - SSH job (instant): runs when VPS_HOST plus VPS_SSH_KEY or VPS_PASSWORD secrets are set.
#    Restarts the app container; its start command pulls the latest code and runs npm install.
#    Optional secrets: VPS_USER_WA (SSH user, default root), VPS_PORT (default 22).
#  - Hostinger job: runs when HOSTINGER_API_KEY secret + HOSTINGER_VM_ID variable are set.
#  - Fallback with no secrets: the server checks GitHub every 3 min (src/autoupdate.js).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SSH: ${{ secrets.VPS_HOST != '' && (secrets.VPS_SSH_KEY != '' || secrets.VPS_PASSWORD != '') }}
    steps:
      - name: Skip notice
        if: env.HAS_SSH != 'true'
        run: echo "SSH deploy skipped - add VPS_HOST and VPS_SSH_KEY (or VPS_PASSWORD) secrets to enable it."

      - name: Restart app on VPS (pulls latest code)
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER_WA || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DOCKER=docker
            if ! docker ps >/dev/null 2>&1; then DOCKER="sudo docker"; fi
            ID=$($DOCKER ps -aq --filter label=com.docker.compose.project=air-agent --filter label=com.docker.compose.service=app | head -n1)
            if [ -z "$ID" ]; then
              echo "Could not find the air-agent app container. Running containers:"
              $DOCKER ps --format '{{.Names}}'
              exit 1
            fi
            echo "Restarting $ID to pull commit ${{ github.sha }}"
            $DOCKER restart "$ID"
            sleep 25
            $DOCKER logs --tail 30 "$ID"

  hostinger-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.HOSTINGER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Hostinger VPS
        if: env.HAS_KEY == 'true'
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: air-agent
          docker-compose-path: docker-compose.yml
          environment-variables: |
            DEPLOY_SHA=${{ github.sha }}
