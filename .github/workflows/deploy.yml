name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    # The Hostinger step is skipped until the HOSTINGER_API_KEY secret is set
    # (Settings > Secrets and variables > Actions). Without it, the server still
    # updates itself from GitHub within a few minutes (src/autoupdate.js).
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.HOSTINGER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Hostinger VPS
        if: env.HAS_KEY == 'true'
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: air-agent
          docker-compose-path: docker-compose.yml
          environment-variables: |
            DEPLOY_SHA=${{ github.sha }}
