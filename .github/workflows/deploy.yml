name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    # Skipped until HOSTINGER_VM_ID is set (Settings > Secrets and variables > Actions).
    # Without it, the server still updates itself from GitHub within a few minutes (src/autoupdate.js).
    if: ${{ vars.HOSTINGER_VM_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: air-agent
          docker-compose-path: docker-compose.yml
          environment-variables: |
            DEPLOY_SHA=${{ github.sha }}
