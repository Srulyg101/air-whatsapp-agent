name: air-agent

# Works with `docker compose up -d` on any server AND with Hostinger's
# Docker Manager "Compose from URL" (no local build or .env needed).
# Override settings with environment variables or a .env file.

services:
  app:
    image: node:22-bookworm
    restart: unless-stopped
    working_dir: /srv
    command:
      - sh
      - -c
      - |
        set -e
        if [ -d /srv/app/.git ]; then git -C /srv/app pull --ff-only || true;
        else git clone --depth 1 ${REPO_URL:-https://github.com/Srulyg101/air-whatsapp-agent.git} /srv/app; fi
        cd /srv/app && npm install --omit=dev --no-audit --no-fund && exec node src/server.js
    environment:
      - BOT_NAME=${BOT_NAME:-Air Agent}
      - MODEL=${MODEL:-qwen2.5:1.5b}
      - NUM_CTX=${NUM_CTX:-4096}
      - HISTORY_TURNS=${HISTORY_TURNS:-12}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-12}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}
      - WHISPER_MODEL=${WHISPER_MODEL:-onnx-community/whisper-base}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-15}
      - OLLAMA_URL=http://ollama:11434
      - DATA_DIR=/data
      - PORT=3000
      # Changes on every GitHub deploy so the app container restarts and pulls the new code
      - DEPLOY_SHA=${DEPLOY_SHA:-initial}
      # Optional: your own domain for HTTPS (otherwise use https://<ip-with-dashes>.sslip.io)
      - DOMAIN=${DOMAIN:-}
    ports:
      - "${PUBLIC_PORT:-8080}:3000"
    volumes:
      - agent-data:/data
      - agent-code:/srv/app
    depends_on:
      - ollama
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Free HTTPS (Let's Encrypt). Open https://<your-ip-with-dashes>.sslip.io — no domain needed.
  # Reads deploy/Caddyfile from the app's code volume, so it updates with git pulls.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - agent-code:/repo:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "-c", "until [ -f /repo/deploy/Caddyfile ]; do echo 'waiting for app code…'; sleep 3; done; exec caddy run --config /repo/deploy/Caddyfile --adapter caddyfile"]
    depends_on:
      - app
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Open-source LLM runtime (not exposed to the internet)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # One-shot: downloads the model on first start
  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 8; ollama pull ${MODEL:-qwen2.5:1.5b}"]
    restart: "no"

  # Uptime monitoring dashboard. Only reachable from the server itself (security):
  # open it with an SSH tunnel:  ssh -L 3001:localhost:3001 root@YOUR_IP  then http://localhost:3001
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-data:/app/data

volumes:
  agent-data:
  agent-code:
  ollama-models:
  uptime-data:
  caddy-data:
  caddy-config:
